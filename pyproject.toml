[project]
name = "codebind"
version = "0.1.0"
description = "A minimal model loop over a persistent IPython session."
readme = "README.md"
authors = [
    { name = "Giovanni Gravili", email = "ghovax@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.0",
    "langchain-core>=1.0",
    "models-provider",
    "rich>=14.0",
]

[project.scripts]
codebind = "codebind.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.uv.sources]
models-provider = { path = "../../public/models-provider", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "RUF"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
