[project]
name = "codebind"
version = "0.4.3"
description = "A frontend-neutral model loop for persistent IPython sessions."
readme = "README.md"
authors = [
    { name = "Giovanni Gravili", email = "ghovax@users.noreply.github.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "ipython", "llm", "repl", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ipython>=9.0",
    "langchain-core>=1.0",
    "models-provider>=0.1.1",
]

[project.urls]
Repository = "https://github.com/ghovax/codebind"
Issues = "https://github.com/ghovax/codebind/issues"

[project.scripts]
codebind = "codebind.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "RUF"]

[tool.uv.build-backend]
data = { data = "data" }
source-include = [
    "jupyterlab/.yarnrc.yml",
    "jupyterlab/install.json",
    "jupyterlab/package.json",
    "jupyterlab/src/**",
    "jupyterlab/tsconfig.json",
    "jupyterlab/yarn.lock",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
